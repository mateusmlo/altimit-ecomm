name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -count=1 -v

      - name: Run integration tests
        run: go test ./... -count=1 -tags integration -timeout 5m -v
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
